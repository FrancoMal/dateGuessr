<header class="site-header">
  <div class="header-inner">
    <a class="brand" routerLink="/" aria-label="DateGuessr, ir al inicio">
      <img
        src="assets/dateguessr_logo-removebg-preview (8).png"
        width="30"
        height="30"
        alt=""
        aria-hidden="true"
      />
      <span class="brand-text">DateGuessr</span>
    </a>

    <nav class="main-nav" aria-label="Navegación principal">
      <a
        *ngFor="let item of navItems"
        class="nav-link"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.exact }"
        [attr.aria-label]="item.label"
      >
        <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    </nav>

    <button
      type="button"
      class="theme-toggle"
      (click)="toggleTheme()"
      [attr.aria-label]="theme === 'dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
      [title]="theme === 'dark' ? 'Tema claro' : 'Tema oscuro'"
    >
      <span aria-hidden="true">{{ theme === 'dark' ? '☀️' : '🌙' }}</span>
    </button>
  </div>
</header>
